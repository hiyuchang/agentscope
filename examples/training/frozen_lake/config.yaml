project: "AgentScope"
name: "AS-Tune-FrozenLake"
checkpoint_root_dir: ${oc.env:TRINITY_CHECKPOINT_ROOT_DIR,./checkpoints}
algorithm:
  algorithm_type: multi_step_grpo
  repeat_times: 16
  kl_loss_fn: "low_var_kl"
  kl_loss_fn_args:
    kl_coef: 0
  advantage_fn_args:
    epsilon: 1e-6
    std_threshold: 0.0001
  optimizer:
    lr: 1e-6
model:
  model_path: ${oc.env:TRINITY_MODEL_PATH,Qwen/Qwen2.5-3B-Instruct}
  max_prompt_tokens: 23552
  max_response_tokens: 2048
  max_model_len: 25600
  temperature: 1.0
buffer:
  total_epochs: 5
  batch_size: 32
  train_batch_size: 1024
  trainer_input:
    experience_buffer:
      name: frozenlake_experience_buffer
      storage_type: queue
      max_read_timeout: 7200
      replay_buffer:
        enable: true
        priority_fn: linear_decay
        priority_fn_args:
          decay: 0.1
explorer:
  runner_per_model: 16
  rollout_model:
    engine_num: 6
    tensor_parallel_size: 1
    enable_chunked_prefill: true
    enforce_eager: false
    enable_openai_api: true
    enable_log_requests: true
    enable_history: true
    enable_auto_tool_choice: true
    tool_call_parser: hermes
    enable_thinking: true
    dtype: bfloat16
    seed: 42
    gpu_memory_utilization: 0.85
trainer:
  save_interval: 100
  use_dynamic_bsz: true
  grad_clip: 1.0
  max_token_len_per_gpu: 25600
  ulysses_sequence_parallel_size: 2
synchronizer:
  sync_method: nccl
  sync_style: dynamic_by_explorer
  sync_interval: 1
  sync_timeout: 1200
